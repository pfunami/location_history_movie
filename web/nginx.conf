server {
    listen 80 default_server;
    server_name journey.d-nsym.com _;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://journey.d-nsym.com$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name journey.d-nsym.com;

    ssl_certificate     /etc/letsencrypt/live/journey.d-nsym.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/journey.d-nsym.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # old path-based URL -> root (in case any link is out there)
    location /journey-viewer/ {
        rewrite ^/journey-viewer/(.*)$ /$1 permanent;
    }

    location / {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 300m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
