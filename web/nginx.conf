server {
    listen 80;
    server_name d-nsym.com _;

    # journey-viewer service
    location /journey-viewer/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 300m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location = /journey-viewer {
        return 301 /journey-viewer/;
    }

    # everything else: pass through to GitHub Pages (pfunami.github.io,
    # custom domain d-nsym.com) so the top page keeps being served by
    # GitHub Pages even after DNS points here
    location / {
        proxy_pass https://pfunami.github.io;
        proxy_set_header Host d-nsym.com;
        proxy_ssl_server_name on;
        proxy_ssl_name d-nsym.com;
        proxy_set_header Accept-Encoding "";
        resolver 1.1.1.1 8.8.8.8 valid=300s;
    }
}
