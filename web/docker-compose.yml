services:
  app:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    volumes:
      - jv-data:/data
    environment:
      - URL_PREFIX=

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  jv-data:
